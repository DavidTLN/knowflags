name: Commons construction sheets

on:
  push:
    branches: [construction-commons]
    paths: [scripts/construction/fetch_commons.py, .github/workflows/construction-commons.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: construction-commons
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python3 scripts/construction/fetch_commons.py
      - name: Commit results
        run: |
          git config user.name "knowflags-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/construction
          git commit -m "Commons construction sheets inventory [skip ci]" || echo "nothing to commit"
          git push origin HEAD:construction-commons
