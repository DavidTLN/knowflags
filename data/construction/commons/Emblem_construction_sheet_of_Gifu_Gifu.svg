<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" 
  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="500" height="600" viewBox="-250 -250 500 600" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1">
  <desc>Emblem construction sheet of Gifu, Gifu</desc>
  <g id="g1">
    <line id="l1" x1="100" y1="-225" x2="100" y2="225" stroke="#999" stroke-width="150" />
    <use xlink:href="#l1" transform="translate(-200,0)" />
  </g>
  <use xlink:href="#g1" transform="rotate(90)" />
  <g stroke="#000" stroke-width="4">
    <line x1="-225" y1="245" x2="225" y2="245" />
    <g id="g2">
      <line x1="225" y1="225" x2="225" y2="265" />
      <line x1="175" y1="225" x2="175" y2="265" />
      <line x1="25" y1="225" x2="25" y2="265" />
    </g>
    <use xlink:href="#g2" transform="scale(-1,1)" />
  </g>
  <g fill="#000" text-anchor="middle" font-size="40">
    <text x="200" y="295">1</text>
    <text x="100" y="295">3</text>
    <text x="0" y="295">1</text>
    <text x="-100" y="295">3</text>
    <text x="-200" y="295">1</text>
  </g>
</svg>