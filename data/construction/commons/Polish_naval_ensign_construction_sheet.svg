<path                d="M 20, 60 v240"/>
<path                d="M 50, 60 v240"/>
<use transform="translate( 20,  60)"             xlink:href="#arrow" />
<use transform="translate( 20, 300) rotate(180)" xlink:href="#arrow" />
<use transform="translate( 50,  60)"             xlink:href="#arrow" />
<use transform="translate( 50, 180) rotate(180)" xlink:href="#arrow" />
<use transform="translate( 50, 180)"             xlink:href="#arrow" />
<use transform="translate( 50, 300) rotate(180)" xlink:href="#arrow" />
<text transform="translate( 16, 180) rotate(-90)">10</text>
<text transform="translate( 46, 120) rotate(-90)">5</text>
<text transform="translate( 46, 240) rotate(-90)">5</text>

<!-- Sizes on the right -->
<path class="dashed" d="M584, 60 h 30"/>
<path class="dashed" d="M272, 72 H614"/>
<path class="dashed" d="M272,168 H614"/>
<path class="dashed" d="M464,180 H614"/>
<path                d="M614, 60 v120"/>
<use transform="translate(614,  60) scale(0.75)"               xlink:href="#arrow" />
<use transform="translate(614,  72) scale(0.75) rotate(180)"   xlink:href="#arrow" />
<use transform="translate(614,  72) scale(0.75 1)"             xlink:href="#arrow" />
<use transform="translate(614, 168) scale(0.75 1) rotate(180)" xlink:href="#arrow" />
