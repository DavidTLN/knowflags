<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="370" viewBox="0 0 640 370">
  <!-- 1 on the image is 24 SVG units -->
  <style type="text/css">
    text {
      font-family: Arial;
      font-size: 16px;
      text-anchor: middle;
    }
    path {
      fill: none;
    }
    path, line {
      stroke: #000000;
    }
    path.white {
      fill: #FFFFFF;
      stroke: none;
    }
    path.red, path.coat {
      fill: #7F7F7F;
      stroke: none;
    }
    path.dashed, line.dashed {
      stroke-dasharray: 2 1;
    }
    path#arrow {
      stroke: none;
      fill: #000;
    }
  </style>
  <defs>
    <path class="arrow" id="arrow" d="M0,0 l3,6,-3,-2,-3,2 z" />
  </defs>

<!-- White and read -->
<path class="white"  d="M 80, 60 h 504 l -120,120 h -384 z"/>
<path class="red"    d="M 80,180 h 384 l  120,120 h -504 z"/>
<path                d="M 80, 60 h 504 l -120,120 l 120,120 h -504 z"/>

<!-- Size at the top -->
<path class="dashed" d="M 80, 30 v 30"/>
<path class="dashed" d="M272, 30 v150"/>
<path                d="M 80, 30 h192"/>
<use transform="translate( 80, 30) rotate(-90)" xlink:href="#arrow" />
<use transform="translate(272, 30) rotate( 90)" xlink:href="#arrow" />
<text x="176" y="26">8</text>

<!-- Sizes at the bottom -->
<path class="dashed" d="M 80,300 v 60"/>
