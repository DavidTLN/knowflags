<text x="272" y="326">16</text>
<text x="524" y="326">5</text>
<text x="332" y="356">21</text>

<!-- Sizes on the left -->
<path class="dashed" d="M 20, 60 h 60"/>
<path class="dashed" d="M 50,180 h 30"/>
